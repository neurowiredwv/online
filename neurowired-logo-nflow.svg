<svg height="420" version="1.1" viewBox="205 285 203 203.25" width="420" xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:xlink="http://www.w3.org/1999/xlink"><style>
#ring { fill:none; stroke:#231f20; stroke-linecap:round; stroke-linejoin:round;
        stroke-dasharray: 700; stroke-dashoffset: 700;
        animation: drawRing 1.4s ease-out forwards; }
.dust { animation: dustPulse 2.6s ease-in-out infinite; }
@keyframes drawRing { to { stroke-dashoffset: 0; } }
@keyframes dustPulse { 0%,100%{ opacity: .22; } 50%{ opacity: .45; } }

/* N-chain flow ---------------------------------------------------------- */
:root{
  --ink:#231f20;
  --hot:#e53935;
  --cycle:2.8s;
}
.node, .conn { fill: var(--ink); animation: glow var(--cycle) ease-in-out infinite; }
@keyframes glow{
  0%, 100% { fill: var(--ink); }
  35% { fill: var(--hot); }
  60% { fill: var(--ink); }
}
/* staggered timing: node -> connector -> node ... */
#node1 { animation-delay: 0.00s; }
#conn1 { animation-delay: 0.10s; }
#node2 { animation-delay: 0.20s; }
#conn2 { animation-delay: 0.30s; }
#node3 { animation-delay: 0.40s; }
#conn3 { animation-delay: 0.50s; }
#node4 { animation-delay: 0.60s; }
#conn4 { animation-delay: 0.70s; }
#node5 { animation-delay: 0.80s; }
#conn5 { animation-delay: 0.90s; }
#node6 { animation-delay: 1.00s; }
#conn6 { animation-delay: 1.10s; }
#node7 { animation-delay: 1.20s; }

#trace{
  fill:none;
  stroke: var(--hot);
  stroke-width: 6;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: traceFlow var(--cycle) ease-in-out infinite;
}
@keyframes traceFlow{
  0%   { opacity: 0; stroke-dashoffset: 260; }
  12%  { opacity: 0.95; }
  70%  { opacity: 0.95; stroke-dashoffset: 0; }
  100% { opacity: 0; stroke-dashoffset: 0; }
}

</style>
