<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroWired Logo Animation</title>
  <style>
  html, body {
    margin: 0;
    padding: 0;
    background: #f5f5f5; /* match Google Sites section */
  }
  object {
    display: block;
    margin: auto;
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Using <object> keeps the SVG animation alive in most browsers -->
    <object type="image/svg+xml" data="neurowired-logo-nflow.svg" aria-label="NeuroWired animated logo"></object>
  </div>
</body>

</html>
