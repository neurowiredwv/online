<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NeuroWired Logo Animation</title>
  <style>
    html,body{height:100%; margin:0;}
    body{
      display:grid; place-items:center;
      background:#ffffff; /* switch to #0b0d10 for dark sites */
    }
    .wrap{width:min(520px, 80vw); height:auto;}
    object, img{width:100%; height:auto; display:block;}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- Using <object> keeps the SVG animation alive in most browsers -->
    <object type="image/svg+xml" data="neurowired-logo-nflow.svg" aria-label="NeuroWired animated logo"></object>
  </div>
</body>
</html>
